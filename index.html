<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>トレーニング</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 80px}h1{font-size:25px;margin:4px 0}.sub,.small{color:#6b7280;font-size:12px}.top{display:flex;justify-content:space-between;align-items:end}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}button{border:0;border-radius:11px;padding:11px;font-weight:700;background:#e5e7eb}.tabs .active,.primary{background:#111827;color:#fff}.card{background:#fff;border-radius:15px;padding:13px;margin:11px 0;box-shadow:0 1px 3px #0001}.exercise{border-top:1px solid #e5e7eb;padding:14px 0}.exercise:first-child{border:0}.exhead{display:flex;justify-content:space-between;gap:8px}.exname{font-size:17px;font-weight:800}.target{font-size:12px;color:#6b7280}.labels,.setrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:7px;align-items:center}.labels{font-size:11px;color:#6b7280;margin-top:9px}.setrow{margin:7px 0}.setno{font-size:12px;color:#6b7280}input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:9px;font-size:16px;background:#fff}textarea{min-height:50px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sym{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hist{border-top:1px solid #e5e7eb;padding:10px 0}.danger{background:#fee2e2;color:#991b1b;padding:6px 9px;margin-top:6px}</style><link rel="manifest" href="manifest.webmanifest"></head><body>
<div class="wrap"><div class="top"><div><div class="sub">8週間ベーシックプログラム</div><h1>トレーニング</h1></div><input id="date" type="date" style="width:145px"></div>
<div class="tabs"><button data-day="DAY1" class="active">DAY1<br><span class="small">HEAVY</span></button><button data-day="DAY2">DAY2<br><span class="small">MIDDLE</span></button><button data-day="DAY3">DAY3<br><span class="small">VOLUME</span></button></div>
<div class="card"><b id="title"></b><div id="desc" class="sub"></div></div><div id="form" class="card"></div>
<div class="card"><b>コンディション</b><div class="sym"><div><span class="small">首・肩の痛み 0〜10</span><input id="pain" type="number" min="0" max="10" value="0"></div><div><span class="small">手のしびれ</span><select id="numb"><option value="no">なし</option><option value="yes">あり</option></select></div></div></div>
<div class="actions"><button id="save" class="primary">記録を保存</button><button id="export">JSON書き出し</button></div><div class="card"><b>履歴</b><div id="history"></div></div></div>
<script>
const programs={"DAY1": {"title": "DAY1 — HEAVY", "desc": "重さの日｜筋力。主要種目は1〜2回の余力を残す。", "exercises": [["スクワット", "5回 × 4セット", 4, "5"], ["ベンチプレス", "5回 × 4セット", 4, "5"], ["ラットプルダウン", "6〜8回 × 3セット", 3, "6-8"], ["ダンベル・バックランジ", "8回 × 3セット", 3, "8"], ["トライセプス", "8〜10回 × 2セット", 2, "8-10"]]}, "DAY2": {"title": "DAY2 — MIDDLE", "desc": "中間の日｜週2回でも全身をカバー。デッドリフトは軽め高回数。", "exercises": [["インクラインベンチ", "8〜10回 × 3セット", 3, "8-10"], ["デッドリフト（軽め）", "10〜12回 × 3セット", 3, "10-12"], ["ローイング", "8〜10回 × 3セット", 3, "8-10"], ["レッグカール", "10〜12回 × 3セット", 3, "10-12"], ["サイドレイズ", "12〜15回 × 3セット", 3, "12-15"], ["ロータリートルソー", "左右12〜15回 × 3セット", 3, "12-15"], ["アームカール", "10〜12回 × 2セット", 2, "10-12"]]}, "DAY3": {"title": "DAY3 — VOLUME", "desc": "量・刺激の日｜行けた週の追加日。重量を追わず丁寧に。", "exercises": [["レッグプレス", "12〜15回 × 3セット", 3, "12-15"], ["チェストプレス", "10〜12回 × 3セット", 3, "10-12"], ["ラットプルダウン", "10〜12回 × 3セット", 3, "10-12"], ["フロントランジ", "10〜12回 × 3セット", 3, "10-12"], ["サイドレイズ", "15〜20回 × 3セット", 3, "15-20"], ["トライセプス", "12〜15回 × 2セット", 2, "12-15"]]}};let current="DAY1";const $=s=>document.querySelector(s);$("#date").value=new Date().toISOString().slice(0,10);
function history(){try{return JSON.parse(localStorage.getItem("workouts")||"[]")}catch(e){return[]}}
function render(){let p=programs[current];$("#title").textContent=p.title;$("#desc").textContent=p.desc;$("#form").innerHTML=p.exercises.map((e,ei)=>`<div class="exercise"><div class="exhead"><div class="exname">${e[0]}</div><div class="target">${e[1]}</div></div><div class="labels"><span>SET</span><span>重量 kg</span><span>回数</span></div>${Array.from({length:e[2]},(_,si)=>`<div class="setrow"><span class="setno">${si+1}</span><input class="weight" data-e="${ei}" data-s="${si}" type="number" step=".5" inputmode="decimal" placeholder="kg"><input class="reps" data-e="${ei}" data-s="${si}" data-t="${e[3]}" type="number" inputmode="numeric" placeholder="回"></div>`).join("")}<textarea class="memo" data-e="${ei}" placeholder="メモ：マシン機種、シート位置、フォームなど"></textarea></div>`).join("");bind();fillPrev()}
function bind(){document.querySelectorAll(".weight").forEach(x=>x.addEventListener("change",()=>{let e=x.dataset.e,s=+x.dataset.s,n=document.querySelector(`.weight[data-e="${e}"][data-s="${s+1}"]`);if(n&&!n.value)n.value=x.value}));document.querySelectorAll(".reps").forEach(x=>x.addEventListener("input",()=>{let t=parseInt(x.dataset.t),v=+x.value;if(v>=t){let a=[...document.querySelectorAll(".reps")],i=a.indexOf(x);if(a[i+1])setTimeout(()=>a[i+1].focus(),60)}}))}
function fillPrev(){let p=[...history()].reverse().find(x=>x.day===current);if(!p)return;(p.exercises||[]).forEach((e,i)=>{let w=document.querySelector(`.weight[data-e="${i}"][data-s="0"]`),m=document.querySelector(`.memo[data-e="${i}"]`);if(w&&e.sets&&e.sets[0])w.value=e.sets[0].weight||"";if(m)m.value=e.memo||""})}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{current=b.dataset.day;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));render()});
$("#save").onclick=()=>{let p=programs[current],ex=p.exercises.map((e,i)=>({name:e[0],memo:document.querySelector(`.memo[data-e="${i}"]`).value,sets:[...document.querySelectorAll(`.weight[data-e="${i}"]`)].map((w,s)=>({weight:w.value,reps:document.querySelector(`.reps[data-e="${i}"][data-s="${s}"]`).value}))})),h=history();h.push({id:Date.now(),date:$("#date").value,day:current,title:p.title,pain:$("#pain").value,numb:$("#numb").value,exercises:ex});localStorage.setItem("workouts",JSON.stringify(h));renderHist();alert("保存しました")};
function renderHist(){let h=history().slice().reverse();$("#history").innerHTML=h.length?h.map(x=>`<div class="hist"><b>${x.date}　${x.title||x.day}</b><div class="small">${(x.exercises||[]).map(e=>`${e.name}：${(e.sets||[]).filter(s=>s.weight||s.reps).map(s=>`${s.weight||"-"}kg×${s.reps||"-"}`).join(" / ")}`).join("<br>")}</div><button class="danger" onclick="delRec(${x.id})">削除</button></div>`).join(""):'<div class="small">まだ記録がありません。</div>'}
window.delRec=id=>{if(confirm("この記録を削除しますか？")){localStorage.setItem("workouts",JSON.stringify(history().filter(x=>x.id!==id)));renderHist()}};
$("#export").onclick=()=>{let b=new Blob([JSON.stringify({workouts:history()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="training-backup.json";a.click()};
render();renderHist();</script></body></html>
